<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestor de tareas: agrega actividades con fecha y prioridad, ordénalas, edítalas o elimínalas.">
    <title>Gestión de tareas | Portafolio</title>
    <link rel="stylesheet" href="./index.css">
    <script src="../../assets/js/volver.js"></script>
    <script src="index.js" defer></script>
</head>

<body>
    <main id="container" class="contenedor">
        <h1 id="titulo-form">Nueva tarea</h1>

        <form id="form-tarea" class="formulario" novalidate>
            <div class="campo">
                <label for="actividad">Actividad</label>
                <input type="text" id="actividad" name="actividad" maxlength="120" placeholder="Ej.: Entregar el informe" required aria-describedby="error-actividad">
                <p class="error" id="error-actividad"></p>
            </div>

            <div class="campo">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" name="fecha" required aria-describedby="error-fecha">
                <p class="error" id="error-fecha"></p>
            </div>

            <div class="campo campo--check">
                <input type="checkbox" id="prioridad" name="prioridad">
                <label for="prioridad">Prioridad alta</label>
            </div>

            <div class="acciones">
                <button type="submit" id="btn-guardar" class="boton">Agregar tarea</button>
                <button type="button" id="btn-cancelar" class="boton boton--secundario" hidden>Cancelar edición</button>
                <button type="button" id="btn-ordenar" class="boton boton--secundario">Ordenar por prioridad</button>
            </div>

            <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        </form>

        <section class="lista" aria-labelledby="titulo-lista">
            <h2 id="titulo-lista">Tareas <span id="contador" class="contador">(0)</span></h2>
            <p id="vacio" class="vacio">No hay tareas todavía. Agrega la primera con el formulario.</p>
            <div id="tablaContainer" class="tabla-scroll" hidden>
                <table class="tabla">
                    <thead>
                        <tr>
                            <th scope="col">Actividad</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Prioridad</th>
                            <th scope="col">Opciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
