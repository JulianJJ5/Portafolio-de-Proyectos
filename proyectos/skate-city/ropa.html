<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ropa de skate: camisetas, camibusos y chaquetas.">
    <title>Ropa | Skate City</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="index.js" defer></script>
    <script src="../../assets/js/volver.js"></script>
</head>

<body>
    <!-- ------------------------------- BARRA DE NAVEGACIÓN ------------------------------- -->
    <nav id="navegacion" class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid" id="menu">
            <a id="tipe" class="navbar-brand" href="index.html">🛹 SKATE CITY</a>

            <button type="button" class="btn btn-primary btn-carrito order-lg-last" data-bs-toggle="modal"
                data-bs-target="#exampleModal" aria-label="Abrir carrito de compras">
                🛒 <span id="contador-carrito" class="badge rounded-pill text-bg-light" hidden>0</span>
            </button>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal"
                aria-controls="menu-principal" aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu-principal">
                <ul id="centro" class="navbar-nav mx-lg-auto">
                    <li class="nav-item"><a href="index.html#contenedor1" class="nav-link enlaces">SKATEBOARDING</a></li>
                    <li class="nav-item"><a href="ropa.html" class="nav-link enlaces active" aria-current="page">ROPA</a></li>
                    <li class="nav-item"><a href="accesorios.html" class="nav-link enlaces">ACCESORIOS</a></li>
                </ul>

                <form id="search" class="d-flex" role="search">
                    <input id="buscador" class="form-control" type="search" placeholder="Buscar..." aria-label="Buscar productos">
                    <button id="btn_buscar" class="btn" type="submit" aria-label="Buscar">🔍</button>
                </form>
            </div>
        </div>
    </nav>

    <main id="principal">
        <section id="contenedor2" class="seccion" aria-labelledby="titulo-ropa">
            <h2 id="titulo-ropa" class="titulo-seccion">ROPA</h2>
            <div id="ropa" class="grilla"></div>
        </section>

        <p id="sin-resultados" class="sin-resultados" hidden>No encontramos productos con esa búsqueda.</p>
    </main>

    <!-- ------------------------------- CARRITO (MODAL) ------------------------------- -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Carrito de Compras</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="carrito-lista">
                    <!-- Lista de productos del carrito -->
                </div>
                <div class="modal-footer" id="total-cost">
                    <!-- Total del costo -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btn-btn-TR">VACIAR CARRITO</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">CERRAR</button>
                    <button type="button" class="btn btn-primary">COMPRAR</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
