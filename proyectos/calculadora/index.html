<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora básica con soporte de teclado, paréntesis y decimales.">
    <title>Calculadora | Portafolio</title>
    <link rel="stylesheet" href="./index.css">
    <script src="../../assets/js/volver.js"></script>
</head>

<body>
    <main class="calculadora" aria-labelledby="titulo">
        <h1 id="titulo" class="calculadora__titulo">Calculadora</h1>

        <div class="pantalla">
            <output id="expresion" class="pantalla__expresion" aria-label="Expresión"></output>
            <output id="resultado" class="pantalla__resultado" aria-live="polite" aria-label="Resultado">0</output>
        </div>

        <div class="teclado" id="teclado">
            <button type="button" class="tecla tecla--accion" data-accion="limpiar" aria-label="Borrar todo">C</button>
            <button type="button" class="tecla tecla--op" data-valor="(" aria-label="Abrir paréntesis">(</button>
            <button type="button" class="tecla tecla--op" data-valor=")" aria-label="Cerrar paréntesis">)</button>
            <button type="button" class="tecla tecla--op" data-valor="/" aria-label="Dividir">÷</button>

            <button type="button" class="tecla" data-valor="7">7</button>
            <button type="button" class="tecla" data-valor="8">8</button>
            <button type="button" class="tecla" data-valor="9">9</button>
            <button type="button" class="tecla tecla--op" data-valor="*" aria-label="Multiplicar">×</button>

            <button type="button" class="tecla" data-valor="4">4</button>
            <button type="button" class="tecla" data-valor="5">5</button>
            <button type="button" class="tecla" data-valor="6">6</button>
            <button type="button" class="tecla tecla--op" data-valor="-" aria-label="Restar">−</button>

            <button type="button" class="tecla" data-valor="1">1</button>
            <button type="button" class="tecla" data-valor="2">2</button>
            <button type="button" class="tecla" data-valor="3">3</button>
            <button type="button" class="tecla tecla--op" data-valor="+" aria-label="Sumar">+</button>

            <button type="button" class="tecla" data-valor="0">0</button>
            <button type="button" class="tecla" data-valor="." aria-label="Punto decimal">.</button>
            <button type="button" class="tecla tecla--accion" data-accion="retroceso" aria-label="Borrar último carácter">⌫</button>
            <button type="button" class="tecla tecla--igual" data-accion="calcular" aria-label="Calcular resultado">=</button>
        </div>

        <p class="ayuda">También puedes usar el teclado: números, + − × ÷, paréntesis, Enter, Retroceso y Esc.</p>
    </main>

    <script src="index.js"></script>
</body>

</html>
