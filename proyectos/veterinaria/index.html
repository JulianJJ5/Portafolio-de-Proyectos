<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria Animalia · Agenda de citas</title>
    <meta name="description" content="Veterinaria Animalia: agenda citas para tus mascotas y consulta tus citas activas y canceladas.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="index.js" defer></script>
    <script src="../../assets/js/volver.js"></script>
</head>

<body>
    <header class="cabecera">
        <h1>Veterinaria Animalia</h1>
    </header>

    <main>
        <section class="hero">
            <img src="imagenes/37a7b8816537e3db82f9a575636c5456.gif" class="perrito" alt="" width="342" height="290">
            <div class="hero__texto">
                <h2>Bienvenido a Animalia</h2>
                <p>Ofrecemos atención médica veterinaria de calidad para tus mascotas.</p>
                <div class="acciones">
                    <button type="button" class="btn-agendar-cita" id="agendar">Agendar Cita</button>
                    <div class="estado-citas">
                        <label for="filtro">Mis Citas</label>
                        <select id="filtro">
                            <option value="activo">Citas Activas</option>
                            <option value="cancelado">Citas Canceladas</option>
                        </select>
                    </div>
                </div>
            </div>
            <img src="imagenes/37a7b8816537e3db82f9a575636c5456.gif" class="perrito perrito--derecha" alt=""
                width="342" height="290">
        </section>

        <section class="citas" aria-labelledby="titulo-citas">
            <h2 class="citas__titulo" id="titulo-citas">Citas activas</h2>
            <p class="citas__vacio" id="vacio">No tienes citas activas. Usa «Agendar Cita» para registrar la primera.</p>
            <div class="citas__lista" id="citas"></div>
        </section>
    </main>

    <footer class="pie">
        <p>&copy; <span id="anio">2026</span> Veterinaria Animalia</p>
    </footer>

    <!-- Aviso flotante de confirmación -->
    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

    <!-- Modal de la cita -->
    <div class="modal fade" id="modalCita" tabindex="-1" aria-labelledby="modalCitaTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <form class="modal-content" id="formCita" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title" id="modalCitaTitulo">VETERINARIA ANIMALIA</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-warning alerta d-none" id="alerta" role="alert"></div>

                    <div class="campo">
                        <label for="nom_mas">Nombre de la mascota</label>
                        <input class="inputs" type="text" placeholder="Nombre de tu mascota" id="nom_mas" autocomplete="off">
                    </div>
                    <div class="campo">
                        <label for="nom_pro">Nombre del propietario</label>
                        <input class="inputs" type="text" placeholder="Nombre del propietario" id="nom_pro" autocomplete="name">
                    </div>
                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input class="inputs" type="tel" inputmode="numeric" placeholder="Teléfono" id="telefono" autocomplete="tel">
                    </div>
                    <div class="campo">
                        <label for="tipo_mas">Tipo de mascota</label>
                        <select class="inputs" id="tipo_mas">
                            <option value="Perro">Canino</option>
                            <option value="Gato">Felino</option>
                            <option value="Roedor">Roedor</option>
                            <option value="Pez">Pez</option>
                        </select>
                    </div>
                    <div class="campo-doble">
                        <div class="campo">
                            <label for="fecha">Fecha</label>
                            <input class="inputs" type="date" id="fecha">
                        </div>
                        <div class="campo">
                            <label for="hora">Hora</label>
                            <input class="inputs" type="time" id="hora" min="06:00" max="22:00">
                        </div>
                    </div>
                    <div class="campo">
                        <label for="sintomas">Síntomas</label>
                        <textarea class="inputs" id="sintomas" rows="3" placeholder="Ingrese los motivos de la cita"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="submit" class="btn btn-primary" id="guardarCita">Guardar y enviar</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
